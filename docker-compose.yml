services:
  redis-broker:
    image: redis:8.0-alpine
    ports:
      - "6380:6379"
    networks:
      - zero-trust-net
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    networks:
      - zero-trust-net

  java-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      redis-broker:
        condition: service_healthy
      postgres-db:
        condition: service_started
    networks:
      - zero-trust-net

  python-ml-engine:
    build:
      context: ./ml-engine 
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      redis-broker:
        condition: service_healthy
    networks:
      - zero-trust-net
    
  vue-frontend:
    build:
      context: ./zero-trust-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - java-gateway
    networks:
      - zero-trust-net

networks:
  zero-trust-net:
    driver: bridge
